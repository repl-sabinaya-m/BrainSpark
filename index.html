<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QuizBharat — Knowledge Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #0e0c1a;
  --surface:   #17132b;
  --surface2:  #1f1a35;
  --border:    rgba(255,255,255,0.07);
  --accent:    #f7c948;
  --accent2:   #e8663d;
  --text:      #f0ecff;
  --muted:     rgba(240,236,255,0.45);
  --correct:   #22c55e;
  --wrong:     #ef4444;
  --correct-bg:rgba(34,197,94,0.12);
  --wrong-bg:  rgba(239,68,68,0.10);
  --r:         18px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Decorative background ── */
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(247,201,72,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(232,102,61,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(99,60,180,0.06) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* ── Grain overlay ── */
body::after {
  content:'';
  position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0; opacity:0.5;
}

#app {
  position:relative; z-index:1;
  max-width:780px; margin:0 auto;
  padding:24px 20px 60px;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}

/* ── SCREENS ── */
.screen { width:100%; animation: fadeUp 0.4s ease both; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── HOME ── */
.home-logo {
  font-family:'Yatra One', cursive;
  font-size:clamp(2.8rem,8vw,5rem);
  line-height:1;
  letter-spacing:-1px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  text-align:center;
  margin-bottom:6px;
}
.home-sub {
  text-align:center;
  color:var(--muted);
  font-size:0.95rem;
  font-weight:300;
  letter-spacing:0.5px;
  margin-bottom:40px;
}
.home-sub span {
  display:inline-block;
  border: 1px solid var(--border);
  border-radius:20px;
  padding:4px 14px;
  font-family:'JetBrains Mono', monospace;
  font-size:0.75rem;
  color:var(--accent);
  background:rgba(247,201,72,0.06);
}

/* Category cards */
.cat-label {
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:14px;
  text-align:center;
}
.cat-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:12px;
  margin-bottom:32px;
}
.cat-card {
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:20px 14px 16px;
  cursor:pointer;
  transition:all 0.2s;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.cat-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--cat-color, var(--accent));
  transform:scaleX(0); transform-origin:left;
  transition:transform 0.25s;
}
.cat-card:hover { border-color:rgba(255,255,255,0.15); transform:translateY(-2px); }
.cat-card:hover::before, .cat-card.active::before { transform:scaleX(1); }
.cat-card.active {
  border-color:var(--cat-color, var(--accent));
  background:var(--surface2);
  box-shadow:0 0 20px rgba(247,201,72,0.08);
}
.cat-icon { font-size:1.8rem; display:block; margin-bottom:8px; }
.cat-name { font-size:0.82rem; font-weight:600; color:var(--text); }
.cat-count { font-size:0.7rem; color:var(--muted); margin-top:3px; font-family:'JetBrains Mono',monospace; }

/* Difficulty row */
.diff-row {
  display:flex; gap:10px; margin-bottom:32px;
}
.diff-btn {
  flex:1; padding:11px 8px;
  border-radius:12px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:0.85rem; font-weight:500;
  cursor:pointer; transition:all 0.2s;
}
.diff-btn:hover { border-color:rgba(255,255,255,0.15); color:var(--text); }
.diff-btn.active {
  border-color:var(--accent);
  background:rgba(247,201,72,0.08);
  color:var(--accent);
}

/* Start button */
.btn-start {
  width:100%;
  padding:16px;
  border-radius:var(--r);
  border:none;
  background:linear-gradient(135deg, #f7c948 0%, #e8663d 100%);
  color:#1a1200;
  font-family:'DM Sans',sans-serif;
  font-size:1rem; font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
  letter-spacing:0.3px;
}
.btn-start:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(247,201,72,0.25); }
.btn-start:disabled { opacity:0.35; cursor:not-allowed; transform:none; }

/* ── QUIZ HEADER ── */
.quiz-header {
  width:100%; margin-bottom:28px;
}
.quiz-meta {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.quiz-cat-tag {
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:20px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  font-size:0.75rem; color:var(--muted);
}
.quiz-score {
  font-family:'JetBrains Mono', monospace;
  font-size:0.85rem;
  color:var(--accent);
  font-weight:600;
}
.quiz-progress-track {
  width:100%; height:5px;
  background:rgba(255,255,255,0.07);
  border-radius:3px; overflow:hidden;
}
.quiz-progress-fill {
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, #f7c948, #e8663d);
  transition:width 0.45s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 10px rgba(247,201,72,0.4);
}
.quiz-qnum {
  font-size:0.72rem; color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  margin-top:8px; text-align:right;
}

/* ── QUESTION CARD ── */
.q-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:32px 28px;
  margin-bottom:16px;
  position:relative;
}
.q-number-badge {
  display:inline-flex; align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;
  color:var(--accent);
  background:rgba(247,201,72,0.1);
  border:1px solid rgba(247,201,72,0.2);
  border-radius:8px;
  padding:3px 10px;
  margin-bottom:16px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.q-text {
  font-size:clamp(1rem,3vw,1.2rem);
  font-weight:500;
  line-height:1.65;
  color:var(--text);
}

/* ── OPTIONS ── */
.options { display:flex; flex-direction:column; gap:10px; }

.opt {
  display:flex; align-items:center; gap:14px;
  padding:15px 18px;
  border-radius:14px;
  border:1.5px solid var(--border);
  background:rgba(255,255,255,0.025);
  cursor:pointer;
  transition:all 0.18s;
  font-size:0.95rem; color:rgba(240,236,255,0.85);
  text-align:left; width:100%;
  font-family:'DM Sans',sans-serif;
  position:relative;
  overflow:hidden;
}
.opt::after {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent);
  opacity:0; transition:opacity 0.15s;
}
.opt:hover:not(:disabled) {
  border-color:rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);
  transform:translateX(4px);
}
.opt:hover:not(:disabled)::after { opacity:1; }

.opt-letter {
  width:30px; height:30px;
  border-radius:9px;
  background:rgba(255,255,255,0.07);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:0.75rem; font-weight:600;
  flex-shrink:0;
  color:var(--muted);
  transition:all 0.18s;
}
.opt-text { flex:1; line-height:1.4; }

/* Correct state */
.opt.correct {
  border-color:var(--correct);
  background:var(--correct-bg);
  color:var(--correct);
  transform:none;
  animation: correctPulse 0.4s ease;
}
.opt.correct .opt-letter {
  background:rgba(34,197,94,0.2);
  color:var(--correct);
}
@keyframes correctPulse {
  0%   { transform:scale(1); }
  40%  { transform:scale(1.018); }
  100% { transform:scale(1); }
}

/* Wrong state */
.opt.wrong {
  border-color:var(--wrong);
  background:var(--wrong-bg);
  color:var(--wrong);
  animation: shake 0.35s ease;
}
.opt.wrong .opt-letter {
  background:rgba(239,68,68,0.15);
  color:var(--wrong);
}
@keyframes shake {
  0%,100%{ transform:translateX(0); }
  20%    { transform:translateX(-5px); }
  40%    { transform:translateX(5px); }
  60%    { transform:translateX(-3px); }
  80%    { transform:translateX(3px); }
}

/* Reveal correct when wrong was chosen */
.opt.reveal-correct {
  border-color:var(--correct);
  background:var(--correct-bg);
  color:var(--correct);
}
.opt.reveal-correct .opt-letter {
  background:rgba(34,197,94,0.2);
  color:var(--correct);
}

.opt.dimmed { opacity:0.3; cursor:default; }
.opt:disabled { cursor:default; }

/* Tick / Cross icons */
.opt-icon {
  margin-left:auto;
  font-size:1.1rem;
  flex-shrink:0;
}

/* ── EXPLANATION ── */
.explanation {
  margin-top:14px;
  padding:14px 18px;
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  border-left:3px solid var(--accent);
  font-size:0.85rem;
  color:var(--muted);
  line-height:1.7;
  animation:fadeUp 0.3s ease;
}
.explanation strong { color:var(--accent); }

/* ── NEXT BUTTON ── */
.btn-next {
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:0.95rem; font-weight:500;
  cursor:pointer;
  transition:all 0.2s;
  margin-top:14px;
  letter-spacing:0.2px;
}
.btn-next:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.2); }

/* ── RESULTS ── */
.result-hero {
  text-align:center;
  padding:40px 20px 32px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.result-hero::before {
  content:'';
  position:absolute; top:-60px; left:50%;
  transform:translateX(-50%);
  width:200px; height:200px;
  background:radial-gradient(circle, rgba(247,201,72,0.12), transparent 70%);
  pointer-events:none;
}
.result-emoji { font-size:3.5rem; display:block; margin-bottom:12px; }
.result-score-big {
  font-family:'Yatra One',cursive;
  font-size:5rem; line-height:1;
  background:linear-gradient(135deg,#f7c948,#e8663d);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.result-label { color:var(--muted); font-size:0.95rem; margin-top:6px; }

.result-stats {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:10px; margin-bottom:20px;
}
.stat-box {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 12px;
  text-align:center;
}
.stat-val {
  font-family:'JetBrains Mono',monospace;
  font-size:1.5rem; font-weight:600;
  color:var(--accent); display:block;
}
.stat-lbl {
  font-size:0.68rem; color:var(--muted);
  text-transform:uppercase; letter-spacing:1px;
  margin-top:4px; display:block;
}

/* Answer review dots */
.review-dots {
  display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; margin-bottom:24px;
}
.rdot {
  width:34px; height:34px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-family:'JetBrains Mono',monospace; font-weight:600;
}
.rdot.c { background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.3); color:var(--correct); }
.rdot.w { background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.25); color:var(--wrong); }

.btn-restart {
  width:100%;
  padding:16px;
  border-radius:var(--r);
  border:none;
  background:linear-gradient(135deg,#f7c948,#e8663d);
  color:#1a1200;
  font-family:'DM Sans',sans-serif;
  font-size:1rem; font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}
.btn-restart:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(247,201,72,0.25); }

/* ── Confetti canvas ── */
#confetti-canvas {
  position:fixed; inset:0;
  pointer-events:none; z-index:100;
}

/* ── Responsive ── */
@media(max-width:500px){
  .q-card { padding:22px 18px; }
  .opt { padding:13px 14px; gap:10px; }
  .result-score-big { font-size:4rem; }
}
</style>
</head>

<canvas id="confetti-canvas"></canvas>
<div id="app"></div>

// CONFETTI
// ════════════════════════════════════════════════════════════════
function launchConfetti(){
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({length:120},()=>({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height - canvas.height,
    r: Math.random()*8+4,
    d: Math.random()*80+80,
    color: ["#f7c948","#e8663d","#6ee7f7","#a78bfa","#4ade80","#f472b6"][Math.floor(Math.random()*6)],
    tilt: Math.random()*10-10,
    tiltAngle:0, tiltSpeed: Math.random()*0.1+0.05,
    speedY: Math.random()*3+2,
  }));
  let frame;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.tiltAngle+=p.tiltSpeed;
      p.y+=p.speedY;
      p.tilt=Math.sin(p.tiltAngle)*15;
      if(p.y>canvas.height){p.y=-20; p.x=Math.random()*canvas.width;}
      ctx.beginPath();
      ctx.fillStyle=p.color;
      ctx.roundRect(p.x+p.tilt,p.y,p.r,p.r*1.6,2);
      ctx.fill();
    });
    frame=requestAnimationFrame(draw);
  }
  draw();
  setTimeout(()=>{cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height);},4000);
}

      <div class="cat-count">${c.easy.length+c.medium.length+c.hard.length} Qs</div>
    </button>`).join("");

  const diffBtns = DIFFICULTIES.map(d=>`
    <button class="diff-btn${state.diff===d.id?" active":""}" data-action="diff" data-id="${d.id}">
      ${d.label}
    </button>`).join("");

  return `<div class="screen">
    <div class="home-logo">QuizBharat</div>
    <div class="home-sub"><span>Indian History · Computers · GK · Science</span></div>

    <div class="cat-label">Choose a Category</div>
    <div class="cat-grid">${catCards}</div>

    <div class="cat-label" style="margin-top:4px">Select Difficulty</div>
    <div class="diff-row">${diffBtns}</div>

    <button class="btn-start" data-action="start" ${!state.catId?"disabled":""}>
      ${state.catId?"Start Quiz →":"Select a category to begin"}
    </button>
  </div>`;
}

// ─── QUIZ ────────────────────────────────────────────────────────
function renderQuiz(){
  const q = state.questions[state.current];
  const total = state.questions.length;
  const pct = ((state.current + (state.answered?1:0)) / total)*100;
  const cat = CATEGORIES.find(c=>c.id===state.catId);

  const opts = q.opts.map((opt,i)=>{
    let cls = "opt";
    let icon = "";
    if(state.answered){
      if(i===q.ans){ cls+=" correct"; icon=`<span class="opt-icon">✓</span>`; }
      else if(i===state.selected && i!==q.ans){ cls+=" wrong"; icon=`<span class="opt-icon">✗</span>`; }
      else { cls+=" dimmed"; }
    }
    return `<button class="opt ${cls}" data-action="answer" data-idx="${i}" ${state.answered?"disabled":""}>
      <span class="opt-letter">${LETTERS[i]}</span>
      <span class="opt-text">${opt}</span>
      ${icon}
    </button>`;
  }).join("");

  const explHtml = state.answered ? `
    <div class="explanation">
      <strong>💡 Explanation:</strong> ${q.exp}
    </div>` : "";

  const nextLabel = state.current+1 >= total ? "See Results →" : "Next Question →";
  const nextBtn = state.answered ? `<button class="btn-next" data-action="next">${nextLabel}</button>` : "";

  return `<div class="screen">
    <div class="quiz-header">
      <div class="quiz-meta">
        <span class="quiz-cat-tag">${cat.icon} ${cat.label} · ${state.diff}</span>
        <span class="quiz-score">Score: ${state.score}</span>
      </div>
      <div class="quiz-progress-track">
        <div class="quiz-progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="quiz-qnum">Question ${state.current+1} of ${total}</div>
    </div>

    <div class="q-card">
      <span class="q-number-badge">Q${String(state.current+1).padStart(2,"0")}</span>
      <p class="q-text">${q.q}</p>
    </div>

    <div class="options">${opts}</div>
    ${explHtml}
    ${nextBtn}
  </div>`;
}

// ─── RESULT ──────────────────────────────────────────────────────
function renderResult(){
  const total = state.questions.length;
  const pct = Math.round((state.score/total)*100);
  let emoji="😅", label="Keep practising — you'll get there!";
  if(pct===100){emoji="🏆"; label="Perfect score! You're a genius!";}
  else if(pct>=80){emoji="🥇"; label="Excellent! Outstanding performance!";}
  else if(pct>=60){emoji="🎯"; label="Good job! You know your stuff!";}
  else if(pct>=40){emoji="📚"; label="Not bad — keep learning!";}

  const dots = state.history.map((h,i)=>`
    <div class="rdot ${h.correct?"c":"w"}" title="Q${i+1}">${i+1}</div>`).join("");

  return `<div class="screen">
    <div class="result-hero">
      <span class="result-emoji">${emoji}</span>
      <div class="result-score-big">${state.score}/${total}</div>
      <div class="result-label">${label}</div>
    </div>

    <div class="result-stats">
      <div class="stat-box">
        <span class="stat-val">${pct}%</span>
        <span class="stat-lbl">Accuracy</span>
      </div>
      <div class="stat-box">
        <span class="stat-val">${state.score}</span>
        <span class="stat-lbl">Correct</span>
      </div>
      <div class="stat-box">
        <span class="stat-val">${total-state.score}</span>
        <span class="stat-lbl">Wrong</span>
      </div>
    </div>

    <div class="cat-label">Your Answers</div>
    <div class="review-dots">${dots}</div>

    <button class="btn-restart" data-action="restart">Play Again</button>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════════
function attachEvents(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", handleAction);
  });
}

function handleAction(e){
  const btn = e.currentTarget;
  const action = btn.dataset.action;

  if(action==="cat"){
    setState({catId: btn.dataset.id});
  }
  else if(action==="diff"){
    setState({diff: btn.dataset.id});
  }
  else if(action==="start"){
    if(!state.catId) return;
    const qs = pickQuestions(state.catId, state.diff);
    setState({
      screen:"quiz",
      questions:qs,
      current:0, selected:null,
      answered:false, score:0, history:[]
    });
  }
  else if(action==="answer"){
    if(state.answered) return;
    const idx = parseInt(btn.dataset.idx);
    const q = state.questions[state.current];
    const correct = idx===q.ans;
    const newHistory = [...state.history, {correct}];
    setState({
      selected:idx,
      answered:true,
      score: correct ? state.score+1 : state.score,
      history: newHistory,
    });
  }
  else if(action==="next"){
    const next = state.current+1;
    if(next>=state.questions.length){
      const pct = (state.score/state.questions.length)*100;
      if(pct>=80) launchConfetti();
      setState({screen:"result"});
    } else {
      setState({current:next, selected:null, answered:false});
    }
  }
  else if(action==="restart"){
    setState({screen:"home", catId:null, diff:"easy", questions:[], current:0, selected:null, answered:false, score:0, history:[]});
  }
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
render();
</script>
</body>
</html>
